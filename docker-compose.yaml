services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - agent_server

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    depends_on:
      - agent_server

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - admin
      - agent_server
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      - NGINX_HOST=strok1.ru
      - NGINX_PORT=80
      - NGINX_SSL_PORT=443
  agent_server:
    build:
      context: ./agent_server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      PROXY_MODEL: ${PROXY_MODEL}
      PROXY_API_KEY: ${PROXY_API_KEY}
      PROXY_BASE_URL: ${PROXY_BASE_URL}
      XMLSTOCK_GOOGLE_URL: ${XMLSTOCK_GOOGLE_URL}
      XMLSTOCK_YANDEXLIVE_URL: ${XMLSTOCK_YANDEXLIVE_URL}
      SAVE_LOGS: ${SAVE_LOGS}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-4}
      DATABASE_URL: postgresql://stroky:stroky@postgres:5432/stroky
      UPLOAD_DIR: /app/uploads
      IP_HASH_SALT: stroky_salt
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      ADMIN_SECRET: ${ADMIN_SECRET:-stroki_admin_secret_key_change_me}
    volumes:
      - ./data/uploads:/app/uploads
      - ./logs:/logs
      - ./.env:/app/.env:ro

  postgres:
    image: ankane/pgvector
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stroky
      POSTGRES_USER: stroky
      POSTGRES_PASSWORD: stroky
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin


volumes:
  pgdata:
  pgadmin_data:
