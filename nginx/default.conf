map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name strok1.ru www.strok1.ru admin.strok1.ru _;
    return 301 https://$host$request_uri;
}

# ── Main site: strok1.ru ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name strok1.ru www.strok1.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/certificate.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100m;

    # API: Stroki agent backend
    location /api/ {
        proxy_pass http://agent_server:8000;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Frontend (CRA dev server behind proxy)
    location / {
        proxy_pass https://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ── Admin panel: admin.strok1.ru ──────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name admin.strok1.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/certificate.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    # Admin API endpoints (proxied to agent_server)
    location /api/admin/ {
        proxy_pass http://agent_server:8000;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Admin frontend (CRA dev server)
    location / {
        proxy_pass https://admin:3000;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
